<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="momGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="100" height="100" rx="24" fill="url(#momGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35"/>
  
  <!-- Soft Radial Glow at top -->
  <circle cx="50" cy="26" r="32" fill="#ffffff" opacity="0.12"/>
  
  <!-- Golden Crown -->
  <g filter="url(#shadow)">
    <path d="M38 18 L43 25 L50 17 L57 25 L62 18 L60 29 L40 29 Z" fill="#fef08a"/>
    <circle cx="38" cy="18" r="1.5" fill="#ffffff"/>
    <circle cx="50" cy="17" r="1.8" fill="#ffffff"/>
    <circle cx="62" cy="18" r="1.5" fill="#ffffff"/>
  </g>
  
  <!-- Sparkles -->
  <path d="M18 36 L19.5 40 L23.5 41.5 L19.5 43 L18 47 L16.5 43 L12.5 41.5 L16.5 40 Z" fill="#fef08a" opacity="0.85"/>
  <path d="M82 36 L83.5 40 L87.5 41.5 L83.5 43 L82 47 L80.5 43 L76.5 41.5 L80.5 40 Z" fill="#fef08a" opacity="0.85"/>
  <circle cx="24" cy="22" r="1.5" fill="#ffffff" opacity="0.75"/>
  <circle cx="76" cy="22" r="1.5" fill="#ffffff" opacity="0.75"/>
  <circle cx="16" cy="72" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="84" cy="72" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Mom Text -->
  <text x="50" y="52" text-anchor="middle" font-size="26" font-weight="900" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#ffffff" letter-spacing="0.5" filter="url(#shadow)">Mom</text>
  
  <!-- v7.0 Badge -->
  <rect x="20" y="61" width="60" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="50" y="79" text-anchor="middle" font-size="16" font-weight="900" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#fef08a" letter-spacing="0.8" filter="url(#shadow)">v7.0</text>
</svg>
